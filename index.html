
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Схема камер</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #toolbar { padding: 10px; background: #eee; display: flex; flex-wrap: wrap; gap: 10px; }
    #canvasContainer { position: relative; margin: 0 auto; background: #ccc; }
    canvas { position: absolute; top: 0; left: 0; }
    .icon-button { padding: 5px 10px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="toolbar">
    <input type="file" id="bgUpload" accept="image/*">
    <button class="icon-button" onclick="selectIcon('fix')">FIX</button>
    <button class="icon-button" onclick="selectIcon('ptz')">PTZ</button>
    <button class="icon-button" onclick="selectIcon('pp')">ПП</button>
    <button class="icon-button" onclick="selectIcon('shield')">Щит</button>
    <button onclick="undo()">↩ Отменить</button>
    <button onclick="saveImage()">💾 Сохранить</button>
  </div>
  <div id="canvasContainer">
    <canvas id="bgCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>
  </div>
  <script>
    const bgCanvas = document.getElementById('bgCanvas');
    const drawCanvas = document.getElementById('drawCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const drawCtx = drawCanvas.getContext('2d');
    const container = document.getElementById('canvasContainer');

    let icons = [];
    let selectedIcon = null;
    let scale = 1;
    let image = null;
    let draggingIcon = null;
    let offsetX = 0, offsetY = 0;

    const iconImages = {
      fix: new Image(),
      ptz: new Image(),
      pp: new Image(),
      shield: new Image()
    };
    iconImages.fix.src = 'fix.png';
    iconImages.ptz.src = 'ptz.png';
    iconImages.pp.src = 'pp.png';
    iconImages.shield.src = 'shield.png';

    function resizeCanvasToImage() {
      if (!image) return;
      bgCanvas.width = drawCanvas.width = image.width * scale;
      bgCanvas.height = drawCanvas.height = image.height * scale;
      container.style.width = bgCanvas.width + 'px';
      container.style.height = bgCanvas.height + 'px';
    }

    document.getElementById('bgUpload').addEventListener('change', e => {
      const file = e.target.files[0];
      image = new Image();
      image.onload = () => {
        scale = 1;
        resizeCanvasToImage();
        redraw();
      };
      image.src = URL.createObjectURL(file);
    });

    drawCanvas.addEventListener('wheel', e => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 1.05 : 0.95;
      scale *= delta;
      resizeCanvasToImage();
      redraw();
    }, { passive: false });

    function selectIcon(type) {
      selectedIcon = type;
    }

    drawCanvas.addEventListener('mousedown', e => {
      const rect = drawCanvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / scale;
      const y = (e.clientY - rect.top) / scale;

      for (let i = icons.length - 1; i >= 0; i--) {
        const icon = icons[i];
        const dx = x - icon.x;
        const dy = y - icon.y;
        if (Math.sqrt(dx*dx + dy*dy) < 20) {
          draggingIcon = icon;
          offsetX = dx;
          offsetY = dy;
          return;
        }
      }

      if (selectedIcon) {
        icons.push({ type: selectedIcon, x, y, angle: 0 });
        redraw();
      }
    });

    drawCanvas.addEventListener('mousemove', e => {
      if (draggingIcon) {
        const rect = drawCanvas.getBoundingClientRect();
        draggingIcon.x = (e.clientX - rect.left) / scale - offsetX;
        draggingIcon.y = (e.clientY - rect.top) / scale - offsetY;
        redraw();
      }
    });

    drawCanvas.addEventListener('mouseup', () => {
      draggingIcon = null;
    });

    function undo() {
      icons.pop();
      redraw();
    }

    function redraw() {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      if (image) {
        bgCtx.drawImage(image, 0, 0, bgCanvas.width, bgCanvas.height);
      }
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      for (const icon of icons) {
        const img = iconImages[icon.type];
        if (img.complete) {
          
        drawCtx.save();
        drawCtx.translate(icon.x * scale, icon.y * scale);
        drawCtx.rotate((icon.angle || 0) * Math.PI / 180);
        drawCtx.drawImage(img, -16, -16, 32, 32);
        drawCtx.restore();
    
        }
      }
    }

    function saveImage() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = bgCanvas.width;
      tempCanvas.height = bgCanvas.height;
      const ctx = tempCanvas.getContext('2d');
      if (image) {
        ctx.drawImage(image, 0, 0, tempCanvas.width, tempCanvas.height);
      }
      for (const icon of icons) {
        const img = iconImages[icon.type];
        if (img.complete) {
          
        ctx.save();
        ctx.translate(icon.x * scale, icon.y * scale);
        ctx.rotate((icon.angle || 0) * Math.PI / 180);
        ctx.drawImage(img, -16, -16, 32, 32);
        ctx.restore();
    
        }
      }
      const link = document.createElement('a');
      link.download = 'schema.png';
      link.href = tempCanvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>

<script>

let rotatingIcon = null;

drawCanvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const rect = drawCanvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / scale;
  const y = (e.clientY - rect.top) / scale;

  for (let i = icons.length - 1; i >= 0; i--) {
    const icon = icons[i];
    const dx = x - icon.x;
    const dy = y - icon.y;
    if (Math.sqrt(dx*dx + dy*dy) < 20) {
      rotatingIcon = icon;
      return;
    }
  }
});

drawCanvas.addEventListener('mousemove', e => {
  if (rotatingIcon) {
    const rect = drawCanvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / scale;
    const y = (e.clientY - rect.top) / scale;
    const dx = x - rotatingIcon.x;
    const dy = y - rotatingIcon.y;
    rotatingIcon.angle = Math.atan2(dy, dx) * 180 / Math.PI;
    redraw();
  } else if (draggingIcon) {
    const rect = drawCanvas.getBoundingClientRect();
    draggingIcon.x = (e.clientX - rect.left) / scale - offsetX;
    draggingIcon.y = (e.clientY - rect.top) / scale - offsetY;
    redraw();
  }
});

drawCanvas.addEventListener('mouseup', () => {
  draggingIcon = null;
  rotatingIcon = null;
});

</script>
</body>
</html>
