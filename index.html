
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Camera Editor - Interactive Handles</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }
    #canvas {
      background: #eee;
      cursor: default;
    }
    #toolbar {
      position: fixed;
      top: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border: 1px solid #ccc;
      z-index: 10;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <input type="file" accept="image/*" onchange="loadBackground(event)" />
    <button onclick="addIcon('fix')">FIX</button>
    <button onclick="addIcon('ptz')">PTZ</button>
    <button onclick="addIcon('shield')">ЩИТ</button>
    <button onclick="addIcon('pp')">ПП</button>
    <button onclick="saveImage()">Сохранить как PNG</button>
  </div>
  <canvas id="canvas" width="1200" height="800"></canvas>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const icons = [];
    const iconImages = {};
    const iconTypes = ["fix", "ptz", "shield", "pp"];
    let backgroundImg = null;

    let selected = null;
    let dragging = false;
    let dragMode = null;
    let startX = 0, startY = 0;

    iconTypes.forEach(type => {
      const img = new Image();
      img.src = type + ".png";
      iconImages[type] = img;
    });

    function loadBackground(event) {
      const file = event.target.files[0];
      const reader = new FileReader();
      reader.onload = e => {
        backgroundImg = new Image();
        backgroundImg.onload = draw;
        backgroundImg.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function addIcon(type) {
      icons.push({ type, x: 600, y: 400, size: 50, rotation: 0 });
      draw();
    }

    function saveImage() {
      const link = document.createElement("a");
      link.download = "scheme.png";
      link.href = canvas.toDataURL();
      link.click();
    }

    function drawHandles(icon) {
      ctx.save();
      ctx.translate(icon.x, icon.y);
      ctx.rotate(icon.rotation);

      const s = icon.size / 2;
      const corners = [[-s, -s], [s, -s], [s, s], [-s, s]];
      ctx.fillStyle = "white";
      ctx.strokeStyle = "black";

      for (let [x, y] of corners) {
        ctx.fillRect(x - 4, y - 4, 8, 8);
        ctx.strokeRect(x - 4, y - 4, 8, 8);
      }

      // Rotate handle
      ctx.beginPath();
      ctx.arc(0, s + 20, 6, 0, Math.PI * 2);
      ctx.fillStyle = "orange";
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    function draw() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (backgroundImg && backgroundImg.complete) {
        const x = (canvas.width - backgroundImg.width) / 2;
        const y = (canvas.height - backgroundImg.height) / 2;
        ctx.drawImage(backgroundImg, x, y);
      }

      for (const icon of icons) {
        const img = iconImages[icon.type];
        if (!img.complete) continue;

        ctx.save();
        ctx.translate(icon.x, icon.y);
        ctx.rotate(icon.rotation);
        ctx.drawImage(img, -icon.size/2, -icon.size/2, icon.size, icon.size);
        ctx.restore();

        if (icon === selected) drawHandles(icon);
      }
    }

    canvas.onmousedown = (e) => {
      const mx = e.offsetX;
      const my = e.offsetY;
      dragging = false;
      dragMode = null;

      for (let icon of [...icons].reverse()) {
        const dx = mx - icon.x;
        const dy = my - icon.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const angle = Math.atan2(dy, dx) - icon.rotation;
        const rx = Math.cos(angle) * dist;
        const ry = Math.sin(angle) * dist;

        const s = icon.size / 2;

        if (Math.abs(rx) < s && Math.abs(ry) < s) {
          selected = icon;
          dragging = true;
          dragMode = "move";
          break;
        }

        // corners
        if ((Math.abs(rx - s) < 8 && Math.abs(ry - s) < 8) ||
            (Math.abs(rx + s) < 8 && Math.abs(ry + s) < 8) ||
            (Math.abs(rx - s) < 8 && Math.abs(ry + s) < 8) ||
            (Math.abs(rx + s) < 8 && Math.abs(ry - s) < 8)) {
          selected = icon;
          dragging = true;
          dragMode = "resize";
          break;
        }

        // rotate handle
        if (Math.abs(rx) < 10 && Math.abs(ry - s - 20) < 10) {
          selected = icon;
          dragging = true;
          dragMode = "rotate";
          break;
        }
      }

      startX = mx;
      startY = my;
    };

    canvas.onmousemove = (e) => {
      if (!dragging || !selected) return;

      const dx = e.offsetX - startX;
      const dy = e.offsetY - startY;

      if (dragMode === "move") {
        selected.x += dx;
        selected.y += dy;
      } else if (dragMode === "resize") {
        selected.size = Math.max(10, selected.size + dx);
      } else if (dragMode === "rotate") {
        const angle1 = Math.atan2(startY - selected.y, startX - selected.x);
        const angle2 = Math.atan2(e.offsetY - selected.y, e.offsetX - selected.x);
        selected.rotation += angle2 - angle1;
      }

      startX = e.offsetX;
      startY = e.offsetY;
      draw();
    };

    canvas.onmouseup = () => {
      dragging = false;
      dragMode = null;
    };

    
        let clipboard = null;
        let history = [];

        window.onkeydown = (e) => {
          if (e.ctrlKey && e.key === 'c' && selected) {
            clipboard = { ...selected };
            return;
          }

          if (e.ctrlKey && e.key === 'v' && clipboard) {
            const clone = { ...clipboard, x: clipboard.x + 20, y: clipboard.y + 20 };
            icons.push(clone);
            selected = clone;
            draw();
            return;
          }

          if (e.ctrlKey && e.key === 'z') {
            if (history.length > 0) {
              const previous = history.pop();
              icons.length = 0;
              icons.push(...previous);
              selected = null;
              draw();
            }
            return;
          }

          history.push(icons.map(i => ({ ...i })));  // snapshot before mutation
        
      if (e.key === 'Delete' && selected) {
        history.push(icons.map(i => ({ ...i })));
        icons.splice(icons.indexOf(selected), 1);
        selected = null;
        draw();
      }
    };

    window.onload = () => draw();
  </script>
</body>
</html>
